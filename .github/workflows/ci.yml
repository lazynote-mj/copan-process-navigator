name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # build도 tsc -b를 돌리지만, 별도 단계로 두어 실패 원인을 바로 구분한다.
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
